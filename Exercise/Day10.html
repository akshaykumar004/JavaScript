// Task 1: Add a click event listener to a button that changes the text content of a paragraph ---->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Event Handling</title>

    <style>
        #paraText{
            font-size: x-large;
            font-style: oblique;
        }
        #changeText{
            font-style: italic;
            border-radius: 7px;
        }
        #restoreText{
            border-radius: 7px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <p id="paraText">Lorem ipsum dolor sit amet consectetur adipisicing elit. Magnam expedita atque ex.</p>
    <button id="changeText">Change Text</button>
    <button id="restoreText">Restore Text</button>

    <script>
        const text = document.getElementById('paraText')
        const originalText = text.textContent

        function changeText() {
            text.textContent = 'Paragraph text has been changed now..!'
        }
        function restoreText() {
            text.textContent = originalText
        }

        // change the paragraph text
        const changeButton = document.getElementById('changeText')
        changeButton.addEventListener('click',changeText)

        // Restore the text
        const restoreButton = document.getElementById('restoreText')
        restoreButton.addEventListener('click',restoreText)

    </script>
</body>
</html>

<!-- --------------------- Task 2: Add a double-click event listener to an image that toggles its visibility -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Img on double click</title>

    <style>
        #linkedInImg {
            margin-left: 500px;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <!-- <a href="https://www.linkedin.com/in/akshaykumar01" target="_blank"> -->
        <img src="C:\Users\77079\OneDrive\Documents/L.jpg" alt="LinkedIn Image" id="linkedInImg">
    <!-- </a> -->

    <script>
        const img = document.getElementById('linkedInImg')

        function doubleToggle(){
            if (img.style.display === 'none') {
                img.style.display = 'block';
            } 
            else {
                img.style.display = 'none';
            }
        }

        // OR you can use visibility option also instead of display ------------

        // function doubleToggle() {
        //     if (img.style.visibility === 'hidden') {
        //         img.style.visibility = 'visible';
        //     } else {
        //         img.style.visibility = 'hidden';
        //     }
        // }


        img.addEventListener('dblclick',doubleToggle)
    </script>
</body>
</html>




<!-- Notes ----------------------------------

Using visibility Instead of display--------
You can use visibility: hidden to hide the image, which will keep the space reserved for the image in the layout. 
When you use visibility: visible, it will show the image again without affecting the layout.
